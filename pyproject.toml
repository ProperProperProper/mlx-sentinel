[project]
name = "mlx-sentinel"
version = "0.1.0"
description = "True MLX KV-cache analysis and response security for Apple Silicon"
requires-python = ">=3.10"
dependencies = ["mlx", "mlx-lm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlx_sentinel*"]

[project.scripts]
mlx-sentinel = "mlx_sentinel.server:main"
mlx-sentinel-doctor = "mlx_sentinel.cli:main"
